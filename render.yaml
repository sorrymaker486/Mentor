# Render Blueprint：Dashboard → New → Blueprint → 连接 GitHub 仓库并选择本文件。
# 首次部署后在 Dashboard → Environment 手动填写（或使用 sync: false 在创建时录入）：
#   PUBLIC_APP_URL = https://<你的服务名>.onrender.com
#   API_KEY 或 OPENAI_API_KEY（AI 功能必填）
# 可选持久化 SQLite：Web Service → Disks → 添加挂载路径 /var/data，
#   再添加环境变量 DATABASE_URL = sqlite:////var/data/users.db（四个斜杠表示绝对路径）。
services:
  - type: web
    name: mentor
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: STATIC_ROOT
        value: /app/static
      - key: STRIP_API_PREFIX
        value: "1"
      - key: PUBLIC_APP_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
