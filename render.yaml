# Render Blueprint：Dashboard → New → Blueprint → 连接 GitHub 仓库并选择本文件。
# 首次部署后在 Dashboard → Environment 填写：
#   PUBLIC_APP_URL = https://<你的服务名>.onrender.com
#   API_KEY 或 OPENAI_API_KEY（AI 功能必填）
#   DATABASE_URL = 托管 Postgres 连接串（推荐：New Postgres → 复制 Internal/External URL）
#     代码会将 postgres:// 转为 postgresql+psycopg://；亦可使用 Neon/Supabase 连接串。
# 可选 SQLite + 持久盘：Disks 挂载 /var/data → DATABASE_URL=sqlite:////var/data/users.db
services:
  - type: web
    name: mentor
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: STATIC_ROOT
        value: /app/static
      - key: STRIP_API_PREFIX
        value: "1"
      - key: PUBLIC_APP_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PASSWORD_RESET_RESEND_API_KEY
        sync: false
      - key: PASSWORD_RESET_RESEND_FROM
        sync: false
      - key: PASSWORD_RESET_RESEND_USE_SDK
        value: "1"
      - key: PASSWORD_RESET_SMTP_HOST
        sync: false
      - key: PASSWORD_RESET_SMTP_PORT
        sync: false
      - key: PASSWORD_RESET_SMTP_USER
        sync: false
      - key: PASSWORD_RESET_SMTP_PASSWORD
        sync: false
      - key: PASSWORD_RESET_SMTP_FROM
        sync: false
